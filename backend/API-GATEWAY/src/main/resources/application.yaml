server:
  port: 8765

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          httpclient:
            use-resolved-address: true
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 1. AUTH SERVICE
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            # 2. ASSET SERVICE
            # Maps: /api/v1/assets/**
            - id: asset-service
              uri: lb://ASSET-SERVICE
              predicates:
                - Path=/api/v1/assets/**

            # 3. ALERT SERVICE
            # Maps: /api/alerts/**
            - id: alert-service
              uri: lb://ALERT-SERVICE
              predicates:
                - Path=/api/alerts/**

            # 4. EVENT INGESTION SERVICE
            # Maps: /api/events/**
            - id: event-ingestion-service
              uri: lb://EVENT-INGESTION-SERVICE
              predicates:
                - Path=/api/events/**

            # 5. ALERT SERVICE WEBSOCKETS
            - id: alert-ws-route
              uri: lb:ws://ALERT-SERVICE
              predicates:
              - Path=/ws-alerts/**
              filters:
              - StripPrefix=0 # Keep the path as is, but ensures cleaner handoff

            # 6. ADMIN SERVER
            - id: admin-server
              uri: lb://ADMIN-SERVER
              predicates:
                - Path=/admin/**

eureka:
  instance:
    prefer-ip-address: true  # <--- THIS IS THE CRITICAL LINE
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always