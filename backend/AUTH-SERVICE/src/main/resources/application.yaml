server:
  port: 8100

spring:
  application:
    name: AUTH-SERVICE
  datasource:
    
    url: jdbc:postgresql://localhost:5432/sentinel-auth
    username: postgres 
    password: 
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      
      host: localhost
      port: 6379

jwt:
  
  secret: 
  access-token-expiration: 900000 # 15 minutes
  refresh-token-expiration: 604800000 # 7 days

eureka:
  instance:
    prefer-ip-address: true 
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always