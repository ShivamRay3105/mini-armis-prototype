spring:
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: risk-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.sr.RISK_ENGINE.model"
        spring.json.value.default.type: "com.sr.RISK_ENGINE.model.AssetEvent"
        spring.json.use.type.headers: false


resilience4j:
  retry:
    instances:
      assetService:
        maxAttempts: 3
        waitDuration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retryExceptions:
          - feign.FeignException          # For general Feign/API errors
          - java.io.IOException           # For "Connection Refused" (Service is down)
          - java.util.concurrent.TimeoutException # For when the service is too slow
          - org.springframework.web.client.RestClientException # Good to keep just in case
  
  # timelimiter:
  #   instances:
  #     assetService:
  #       timeoutDuration: 2s
  #       cancelRunningFuture: true

  circuitbreaker:
    instances:
      assetService:
        sliding-window-type: COUNT_BASED
        # time based is good for high traffic services like 100+ request per second
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permitted-number-of-calls-in-half-open-state: 3

